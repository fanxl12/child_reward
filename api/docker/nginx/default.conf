server {
    listen 80;
    server_name api.fanxl.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.fanxl.cn;

    ssl_certificate /etc/nginx/certs/api.fanxl.cn.crt;
    ssl_certificate_key /etc/nginx/certs/api.fanxl.cn.key;

    client_max_body_size 20m;

    location = /api {
        return 307 /api/;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 兼容小程序当前 baseUrl=https://api.fanxl.cn/api 且接口路径仍以 /api 开头的情况
    location /api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 微信小程序访问入口：https://api.fanxl.cn/api
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
